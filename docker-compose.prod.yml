services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: sih26043-postgres:pg16-postgis-pgvector
    container_name: sih26043-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sih26043_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sih26043_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: sih26043-prod-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  minio:
    image: minio/minio:latest
    container_name: sih26043-prod-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - prod_minio_data:/data
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && read -r status <&3 && [[ \"$$status\" == *'200'* ]]"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio-init:
    image: minio/mc:latest
    container_name: sih26043-prod-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until mc alias set localminio http://minio:9000 minioadmin minioadmin; do
        echo 'Waiting for MinIO connection...';
        sleep 1;
      done;
      mc mb --ignore-existing localminio/sih26043-media;
      mc anonymous set download localminio/sih26043-media;
      echo 'MinIO init successfully completed.';
      exit 0;
      "

  ai-engine:
    build:
      context: ./services/ai-engine
      dockerfile: Dockerfile
    container_name: sih26043-prod-ai-engine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_dev}@postgres:5432/${POSTGRES_DB:-sih26043_db}?schema=public
      INTERNAL_AI_SERVICE_KEY: ${INTERNAL_AI_SERVICE_KEY:-dev_internal_ai_service_secret_key}
      EMBEDDING_MODEL_NAME: sentence-transformers/all-MiniLM-L6-v2
      DEDUP_SIMILARITY_THRESHOLD: "0.68"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: sih26043-prod-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_dev}@postgres:5432/${POSTGRES_DB:-sih26043_db}?schema=public
      REDIS_URL: redis://redis:6379
      AI_ENGINE_URL: http://ai-engine:8000
      INTERNAL_AI_SERVICE_KEY: ${INTERNAL_AI_SERVICE_KEY:-dev_internal_ai_service_secret_key}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sih26043-prod-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password_dev}@postgres:5432/${POSTGRES_DB:-sih26043_db}?schema=public
      REDIS_URL: redis://redis:6379
      AI_ENGINE_URL: http://ai-engine:8000
      INTERNAL_AI_SERVICE_KEY: ${INTERNAL_AI_SERVICE_KEY:-dev_internal_ai_service_secret_key}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: sih26043-media
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production_min_32_chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_jwt_refresh_secret_change_in_production_min_32_chars}
      NEXT_PUBLIC_ENABLE_DEMO_HELPER: "true"
    ports:
      - "3000:3000"

volumes:
  prod_postgres_data:
  prod_redis_data:
  prod_minio_data:
